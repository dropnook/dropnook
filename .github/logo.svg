<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="dropnook">
  <title>dropnook</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A9AA0"/>
      <stop offset="1" stop-color="#0B5F66"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EBEF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#8CD9DC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8CD9DC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- the nook: a cosy corner the drop sits in -->
  <path d="M232 332 V752 a40 40 0 0 0 40 40 H692" fill="none" stroke="#08161A" stroke-opacity="0.22" stroke-width="56" stroke-linecap="round"/>
  <path d="M232 332 V752 a40 40 0 0 0 40 40 H692" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="40" stroke-linecap="round"/>
  <!-- the drop -->
  <g transform="translate(560 470)">
    <path d="M0 -250 C 90 -120, 200 -10, 200 90 A 200 200 0 1 1 -200 90 C -200 -10, -90 -120, 0 -250 Z" fill="#08161A" fill-opacity="0.18" transform="translate(10 14)"/>
    <path d="M0 -250 C 90 -120, 200 -10, 200 90 A 200 200 0 1 1 -200 90 C -200 -10, -90 -120, 0 -250 Z" fill="url(#drop)"/>
    <path d="M-120 110 A 125 125 0 0 0 -40 215" fill="none" stroke="#54C0C4" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
